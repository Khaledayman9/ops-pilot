backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**"

frontend:
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

infra:
  - changed-files:
      - any-glob-to-any-file: "docker-compose*.yml"
      - any-glob-to-any-file: "**/Dockerfile"
      - any-glob-to-any-file: ".github/workflows/infra.yml"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

database:
  - changed-files:
      - any-glob-to-any-file: "backend/alembic/**"

documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
      - any-glob-to-any-file: "**/*.rst"
