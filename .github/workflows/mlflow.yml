name: MLflow Experiment Tracking

on:
  workflow_dispatch:
    inputs:
      experiment_name:
        description: "MLflow experiment name"
        required: true
        default: "ops-pilot-agent-eval"
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 3 AM UTC

jobs:
  track-agent-evals:
    name: Run agent evaluations and log to MLflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: ${{ github.event.inputs.experiment_name || 'ops-pilot-agent-eval' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: gpt-4o
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/opspilot
      SECRET_KEY: ci-secret
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv + mlflow
        run: |
          pip install uv
          uv sync
          uv pip install mlflow

      - name: Run agent evaluation suite
        run: |
          uv run python - <<'EOF'
          import asyncio
          import mlflow
          import os
          from unittest.mock import AsyncMock, patch

          from app.agents.classifier.agent import ClassifierAgent
          from app.agents.classifier.models import ClassificationInput

          mlflow.set_tracking_uri(os.environ.get("MLFLOW_TRACKING_URI", "mlruns"))
          mlflow.set_experiment(os.environ.get("MLFLOW_EXPERIMENT_NAME", "ops-pilot-eval"))

          test_cases = [
              {
                  "query": "Checkout service latency spike after v2.3.1 deployment",
                  "expected_service": "checkout-service",
                  "expected_severity": "P1",
              },
              {
                  "query": "Payment service returning 503 errors for 20% of users",
                  "expected_service": "payment-service",
                  "expected_severity": "P1",
              },
              {
                  "query": "Redis connection pool exhausted on checkout-service",
                  "expected_service": "checkout-service",
                  "expected_severity": "P2",
              },
          ]

          async def run_eval():
              agent = ClassifierAgent()
              correct_service = 0
              correct_severity = 0

              with mlflow.start_run(run_name="classifier-eval"):
                  mlflow.log_param("num_test_cases", len(test_cases))
                  mlflow.log_param("agent", "ClassifierAgent")

                  for i, tc in enumerate(test_cases):
                      try:
                          result = await agent.run(ClassificationInput(query=tc["query"]))
                          svc_ok = result.service == tc["expected_service"]
                          sev_ok = result.severity == tc["expected_severity"]
                          correct_service  += int(svc_ok)
                          correct_severity += int(sev_ok)
                          mlflow.log_metric(f"case_{i}_service_correct",  int(svc_ok))
                          mlflow.log_metric(f"case_{i}_severity_correct", int(sev_ok))
                          mlflow.log_metric(f"case_{i}_confidence", result.confidence)
                      except Exception as exc:
                          mlflow.log_param(f"case_{i}_error", str(exc))

                  svc_acc = correct_service  / len(test_cases)
                  sev_acc = correct_severity / len(test_cases)
                  mlflow.log_metric("service_accuracy",  svc_acc)
                  mlflow.log_metric("severity_accuracy", sev_acc)
                  print(f"Service accuracy: {svc_acc:.0%}")
                  print(f"Severity accuracy: {sev_acc:.0%}")

          asyncio.run(run_eval())
          EOF

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-runs
          path: backend/mlruns/
          retention-days: 30