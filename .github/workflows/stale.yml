name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has had no activity for 60 days and has been marked stale.
            It will be closed in 7 days unless there is new activity.
          close-issue-message: >
            This issue was closed due to inactivity. Feel free to reopen if it is still relevant.
          days-before-issue-stale: 60
          days-before-issue-close: 7

          # PRs
          stale-pr-label: "stale"
          stale-pr-message: >
            This PR has had no activity for 30 days and has been marked stale.
            It will be closed in 7 days unless there is new activity.
          close-pr-message: >
            This PR was closed due to inactivity. Feel free to reopen if you'd like to continue.
          days-before-pr-stale: 30
          days-before-pr-close: 7

          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
