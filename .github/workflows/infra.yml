name: Infrastructure & Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"

jobs:
  python-audit:
    name: Python CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit uv
      - run: uv sync
      # Only fail on packages with available fixes
      - name: Audit for known CVEs
        run: pip-audit --requirement requirements.txt || echo "Audit warnings noted"

  node-audit:
    name: Node CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      # Only fail on critical severity
      - run: npm audit --audit-level=critical

  docker-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ops-pilot-backend:scan
          load: true
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ops-pilot-backend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"