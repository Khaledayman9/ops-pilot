name: Infrastructure & Security

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"

jobs:
  python-audit:
    name: Python dependency CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit uv
      - run: uv sync
      - run: pip-audit --requirement requirements.txt --strict

  node-audit:
    name: Node dependency CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm audit --audit-level=high

  docker-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [python-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ops-pilot-backend:scan
          load: true
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ops-pilot-backend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"