name: Code Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend — Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff lint check
        run: ruff check app/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format app/ tests/ --check

  frontend-lint:
    name: Frontend — ESLint + Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit

  commit-lint:
    name: Conventional Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint
        run: |
          npm install --global @commitlint/cli @commitlint/config-conventional
      - name: Lint commit messages
        run: |
          commitlint --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} \
                     --to   ${{ github.event.pull_request.head.sha || 'HEAD' }} \
                     --verbose