[project]
name = "ops-pilot-backend"
version = "0.1.0"
description = "AI-powered multi-agent incident response platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "celery[redis]>=5.3.6",
    "crewai>=0.30.0",
    "cryptography>=42.0.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.1.13",
    "langchain-core>=0.3.36",
    "langchain-google-genai>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=0.2.0",
    "mcp>=1.26.0",
    "neo4j>=5.20.0",
    "passlib[bcrypt]>=1.7.4",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "redis>=5.0.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.29.0",
    "markitdown>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
